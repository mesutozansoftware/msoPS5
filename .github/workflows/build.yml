name: Build and Release msoPS5

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCCACHE_GHA_ENABLED: "true"
  KYTY_BUILD_ORIGIN: ${{ github.repository != 'mesutozansoftware/msoPS5' && 'Fork' || github.event_name == 'push' && 'Official' || 'Source' }}
  KYTY_BUILD_REPOSITORY: ${{ github.repository }}

jobs:
  metadata:
    name: Prepare build metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_tag.outputs.value }}

    steps:
      - name: Generate release tag
        id: release_tag
        shell: bash
        run: |
          echo "value=msoPS5-$(date -u +'%Y-%m-%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  macos:
    name: Build msoPS5 (macOS Apple Silicon)
    needs: metadata
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26
        shell: bash
        run: |
          xcode_path="$(ls -d /Applications/Xcode_26*.app | tail -n 1)"
          test -n "$xcode_path"
          sudo xcode-select --switch "$xcode_path/Contents/Developer"
          xcodebuild -version

      - name: Install build dependencies
        shell: bash
        run: |
          brew install glslang
          # The package-installer test fixtures are generated with Python's cryptography package.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Verify toolchain
        shell: bash
        run: |
          git --version
          cmake --version
          ninja --version
          clang++ --version
          glslangValidator --version
          echo "Host architecture: $(uname -m)"
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B _Build/macos \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DKYTY_BUILD_ORIGIN="$KYTY_BUILD_ORIGIN" \
            -DKYTY_BUILD_REPOSITORY="$KYTY_BUILD_REPOSITORY" \
            -DKYTY_RELEASE_TAG="${{ needs.metadata.outputs.release_tag }}" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DPython3_EXECUTABLE="$RUNNER_TEMP/venv/bin/python" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        shell: bash
        run: |
          cmake --build _Build/macos \
            --target launcher audio_out2_port_tests pad_haptics_tests controller_settings_tests ime_dialog_tests lru_cache_tests virtual_memory_allocation_tests \
              memory_tracker_tests page_manager_tests shader_recompiler_compute_tests \
              resource_tracking_tests scalar_provenance_tests \
              resource_materialization_tests shader_vertex_metadata_tests archive_file_tests avplayer_file_tests \
              package_installer_tests \
            --parallel

      - name: Test
        shell: bash
        run: |
          ctest --test-dir _Build/macos --output-on-failure \
            -R '^(audio_out2_port|pad_haptics|controller_settings|ime_dialog|lru_cache|memory_tracker|page_manager|resource_tracking|scalar_provenance|resource_materialization|shader_vertex_metadata|archive_file|avplayer_file|virtual_memory_allocation|package_installer)$'
          # Fail if the installer test was skipped because its fixture generator is unavailable.
          registered="$(ctest --test-dir _Build/macos -N -R '^package_installer$')"
          grep -Eq 'Test +#[0-9]+: package_installer$' <<< "$registered"

      - name: Install
        shell: bash
        run: |
          cmake --install _Build/macos --prefix _Build/macos/install

      - name: Bundle MoltenVK
        shell: bash
        run: packaging/macos/bundle-moltenvk.sh _Build/macos/install

      - name: Verify artifacts
        shell: bash
        run: |
          install_dir="_Build/macos/install"
          app_dir="$install_dir/msoPS5.app"
          test -d "$app_dir"
          for binary in \
            "$install_dir/kyty_emulator" \
            "$install_dir/libMoltenVK.dylib" \
            "$app_dir/Contents/MacOS/msoPS5" \
            "$app_dir/Contents/MacOS/kyty_emulator" \
            "$app_dir/Contents/Frameworks/libMoltenVK.dylib"; do
            file "$binary"
            lipo "$binary" -verify_arch x86_64
          done
          for binary in \
            "$install_dir/kyty_emulator" \
            "$install_dir/libMoltenVK.dylib" \
            "$app_dir/Contents/MacOS/msoPS5" \
            "$app_dir/Contents/MacOS/kyty_emulator" \
            "$app_dir/Contents/Frameworks/libMoltenVK.dylib"; do
            codesign --verify --strict "$binary"
          done
          codesign --verify --deep --strict --verbose=2 "$app_dir"

      - name: Create disk image
        shell: bash
        run: |
          packaging/macos/make-dmg.sh \
            _Build/macos/install/msoPS5.app \
            "$RUNNER_TEMP/msoPS5-macOS-AppleSilicon.dmg"

      - name: Verify disk image
        shell: bash
        run: |
          mount_point="$(mktemp -d)"
          hdiutil attach "$RUNNER_TEMP/msoPS5-macOS-AppleSilicon.dmg" \
            -nobrowse -readonly -mountpoint "$mount_point"
          status=0
          test -L "$mount_point/Applications" || status=1
          codesign --verify --deep --strict --verbose=2 "$mount_point/msoPS5.app" || status=1
          lipo "$mount_point/msoPS5.app/Contents/MacOS/kyty_emulator" -verify_arch x86_64 || status=1
          hdiutil detach "$mount_point"
          exit "$status"

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v4
        with:
          name: msoPS5-macOS-AppleSilicon
          path: ${{ runner.temp }}/msoPS5-macOS-AppleSilicon.dmg
          if-no-files-found: error

  release:
    name: Release msoPS5
    if: github.event_name == 'push' && github.repository == 'mesutozansoftware/msoPS5'
    needs: [metadata, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_NAME: ${{ needs.metadata.outputs.release_tag }}

    steps:
      - name: Download macOS disk image
        uses: actions/download-artifact@v4
        with:
          name: msoPS5-macOS-AppleSilicon
          path: artifacts

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$RELEASE_NAME-macOS-AppleSilicon.dmg"
          cp artifacts/msoPS5-macOS-AppleSilicon.dmg "$asset"
          if gh release view "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_NAME" "$asset" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_NAME" "$asset" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME"
          fi
